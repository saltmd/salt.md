name: Release

# Push a tag like v1.0.0 to build prebuilt binaries for every platform and
# attach them to a GitHub Release. install.sh downloads from here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Build the frontend once — it's the same embedded static bundle for
      # every OS/arch, so we reuse web/dist across all cross-compiles.
      #
      # SALT_VERSION is not optional here. The frontend stamps it in and
      # compares it against the version the server reports; built without it
      # the bundle says "dev", the binary says "v1.0.0", and every page load
      # raises "a new version is available" that reloading never clears. That
      # shipped in v1.0.0 and is what this env block exists to prevent.
      - name: Build frontend
        run: make frontend
        env:
          SALT_VERSION: ${{ github.ref_name }}

      - name: Cross-compile binaries
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; ext="${3:-}"
            out="dist/salt-${os}-${arch}${ext}"
            echo "→ $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X salt/server.Version=${VERSION}" \
              -o "$out" .
          }
          build linux  amd64
          build linux  arm64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          ( cd dist && sha256sum salt-* > SHA256SUMS.txt )
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
