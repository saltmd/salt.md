name: Desktop app

# The desktop app is released on its OWN tags, separate from the server.
#
# It has to be. The app is a window onto a server and is built to work against
# instances older than itself, so its version answers a different question than
# the server's — and tying them together would mean a server release nobody can
# skip every time a menu item moves. `desktop-v0.2.0` here, `v1.6.18` there.
on:
  push:
    tags: ['desktop-v*']
  # For trying the build without cutting a release: it produces artefacts and
  # publishes nothing. Worth having, because two of these three platforms have
  # never been built at all and the first attempt is not going to be clean.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Do NOT cancel the other when one fails. On the first real run the point
      # is to learn which platform works, and one failure hiding the other
      # result teaches half as much.
      #
      # WINDOWS IS DELIBERATELY ABSENT. electron-builder can produce an NSIS
      # installer, and an unsigned one meets SmartScreen: a full-screen blue
      # panel saying Windows protected your PC, publisher unknown, with the
      # button to continue hidden behind "More info". That reads as malware, not
      # as a product — worse than offering nothing. Windows code signing needs
      # its own certificate, and since 2023 a hardware token or a cloud signing
      # service to hold the key. Add the platform back when that exists, not
      # before.
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon; builds both arches
            name: macOS
            args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            name: Linux
            args: --linux AppImage deb --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

      # ---- signing, macOS only -------------------------------------------
      #
      # A Developer ID certificate lives in a keychain, and a fresh runner has
      # none — so the .p12 is imported into a throwaway keychain that exists for
      # the length of this job. The alternative, leaving it in the login
      # keychain, is not available: GitHub runners have no login session.
      #
      # Every step here is skipped when the secrets are absent, and the build
      # then produces an UNSIGNED app rather than failing. That is deliberate:
      # a fork, and this repository before the certificate existed, must still
      # be able to build the thing.
      - name: Import the signing certificate
        if: matrix.os == 'macos-14' && env.CERT != ''
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign stops to ask for permission — and a prompt on
          # a machine with no screen is a job that hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # An App Store Connect API key rather than an app-specific password.
      # Both work; this one does not break when the account password is changed,
      # can be revoked on its own without touching the Apple account, and is not
      # a credential a person also uses to sign in. The .p8 is issued exactly
      # once and cannot be downloaded again — it lives in the secret store and
      # is written to a file here because notarytool takes a path, not a value.
      - name: Place the notarisation key
        if: matrix.os == 'macos-14' && env.KEY != ''
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build
        env:
          # electron-builder notarises when all three are present and skips it
          # when they are not, saying so in the log.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # electron-builder publishes to a GitHub Release on its own when it
          # sees a token. It must not: the release is assembled once, at the end,
          # from what every platform produced.
          GH_TOKEN: ''
        run: npx electron-builder ${{ matrix.args }} --publish never

      # electron-builder notarises the .app and then packs it into a .dmg — so
      # the disk image itself is never submitted, and it is the disk image that
      # somebody downloads. Without this the app inside is perfect and the thing
      # they double-click still gets a warning. Signing must come before
      # notarising, and stapling after: any signature applied later invalidates
      # the ticket.
      - name: Notarise the disk images too
        if: matrix.os == 'macos-14' && env.KEY_ID != ''
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in dist/*.dmg; do
            codesign --sign "Developer ID Application" --timestamp -f "$dmg"
            xcrun notarytool submit "$dmg" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
              --wait --timeout 45m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Proof rather than hope. `spctl` answers the question a stranger's Mac
      # will ask, and the job should fail here rather than ship a .dmg that
      # opens on nobody's machine but ours.
      - name: Check the signature
        if: matrix.os == 'macos-14'
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier'
          if spctl -a -vvv -t exec "$APP" 2>&1 | grep -q 'accepted'; then
            echo "notarised and accepted by Gatekeeper"
          else
            echo "::warning::signed but NOT notarised — it will not open on another Mac"
            spctl -a -vvv -t exec "$APP" 2>&1 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: salt-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p out && find artifacts -type f -exec mv {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # Its own release, not the server's. Somebody looking for the server
          # binaries should never find an installer for a different program
          # under the same tag.
          name: Desktop ${{ github.ref_name }}
          body: |
            The salt.md desktop app — a window onto a server you run.

            It is **not** how you install salt.md. The server is a separate
            download; see https://salt.md/self-host/. Install that first, then
            point this at it.

            macOS builds are signed and notarised by Apple — they open with no
            warning. Linux builds are unsigned, which is ordinary there.

            There is no Windows build yet: an unsigned installer meets
            SmartScreen and reads as malware, which is worse than offering
            nothing.
