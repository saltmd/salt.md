# fail2ban filter for salt.md
#
# Matches the one line the server writes for a rejected credential. The format
# is a parsing contract — see server/authlog.go, which says so too.
#
# The date prefix is OPTIONAL and that is not cosmetic: Go's logger puts
# "2006/01/02 15:04:05 " in front of every line, so a pattern anchored straight
# at "auth:" matches nothing at all. The first version of this file was written
# from the format string instead of from a real line, and would have sat in a
# jail silently never firing. Verified against the journal of a running
# instance — do the same after any change:
#
#   journalctl -u salt --since -7d | fail2ban-regex - /etc/fail2ban/filter.d/salt.conf
#
[Definition]
failregex = ^(?:\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} )?auth: rejected (?:password|token) from <HOST>$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=salt.service
